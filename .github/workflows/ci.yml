name: Portfolio checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run verify:build
      - name: Check shared-hosting route fallback is packaged
        run: test -f dist/.htaccess
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
